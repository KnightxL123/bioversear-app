<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#185FA5">
  <title>BioVerseAR — Teacher</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BioVerseAR">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="ar-head">
      <div class="title">Teacher</div>
      <div style="flex:1"></div>
      <button class="iconbtn" id="logout" title="Log out" aria-label="Log out">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 12H4m0 0l3.5-3.5M4 12l3.5 3.5M13 7V5a2 2 0 012-2h3a2 2 0 012 2v14a2 2 0 01-2 2h-3a2 2 0 01-2-2v-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <p class="t-hello">Signed in as <strong id="t-name">teacher</strong></p>

    <!-- CLASSES -->
    <section id="classes-view">
      <h2 class="section-title">Create a class</h2>
      <form id="create-form" class="acct-card" novalidate>
        <div class="field"><label for="c-name">Class name</label><input id="c-name" type="text" maxlength="40" placeholder="e.g. Grade 7 - Rizal"></div>
        <div class="form-msg" id="create-msg"></div>
        <button class="btn" type="submit">Create class</button>
      </form>
      <p class="acct-note">A code is generated for each class — share it with your students so they can join.</p>

      <h2 class="section-title">Your classes</h2>
      <div id="class-list"></div>
    </section>

    <!-- ROSTER -->
    <section id="roster-view" hidden>
      <a class="iconbtn" id="roster-back" href="#" style="margin-bottom:12px" aria-label="Back to classes">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h1 class="page-h" id="roster-title">Class</h1>
      <p class="lb-scope" id="roster-sub">—</p>
      <div id="roster-list"></div>
    </section>

    <div class="spacer-grow"></div>
  </div>

  <script src="assets/vendor/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
  (function () {
    'use strict';
    var profile = BV.requireTeacher(); if (!profile) return;
    var $ = function (id) { return document.getElementById(id); };
    $('t-name').textContent = profile.fullName || profile.alias;
    $('logout').addEventListener('click', function () { if (confirm('Log out?')) BV.signOut(); });

    // ---- Classes ----
    function classCard(c) {
      var el = document.createElement('button');
      el.className = 'tclass'; el.type = 'button';
      el.innerHTML =
        '<div class="tclass-body"><div class="tclass-name">' + BV.escape(c.name) + '</div>' +
        '<div class="tclass-meta">Code <b>' + BV.escape(c.code) + '</b> · ' + c.student_count + ' student' + (c.student_count == 1 ? '' : 's') + '</div></div>' +
        '<span class="tclass-go">›</span>';
      el.addEventListener('click', function () { openRoster(c); });
      return el;
    }
    function loadClasses() {
      var host = $('class-list'); host.innerHTML = '<div class="lb-empty">Loading…</div>';
      BV.getTeacherClasses().then(function (list) {
        host.innerHTML = '';
        if (!list.length) { host.innerHTML = '<div class="lb-empty">No classes yet. Create one above and share its code with your students.</div>'; return; }
        list.forEach(function (c) { host.appendChild(classCard(c)); });
      });
    }
    $('create-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var name = $('c-name').value.trim(), msg = $('create-msg');
      function show(kind, text) { msg.className = 'form-msg show ' + kind; msg.textContent = text; }
      if (!name) { show('err', 'Enter a class name.'); return; }
      var btn = this.querySelector('button[type="submit"]'); btn.disabled = true; var t = btn.textContent; btn.textContent = 'Creating…';
      BV.createClass(name).then(function (r) {
        btn.disabled = false; btn.textContent = t;
        if (r.ok) { show('ok', 'Class created — code ' + r.cls.code); $('c-name').value = ''; loadClasses(); }
        else { show('err', r.error); }
      });
    });
    $('c-name').addEventListener('input', function () { $('create-msg').className = 'form-msg'; });

    // ---- Roster (real names + scores; reset password) ----
    function rosterRow(s) {
      var row = document.createElement('div');
      row.className = 'troster';
      row.innerHTML =
        '<div class="troster-main"><div class="troster-name">' + BV.escape(s.full_name || '(no name)') + '</div>' +
        '<div class="troster-sub">@' + BV.escape(s.alias) + ' · ' + s.score + ' pts · ' + s.badges + ' badge' + (s.badges == 1 ? '' : 's') + '</div></div>' +
        '<button class="btn secondary troster-reset" type="button">Reset password</button>' +
        '<form class="troster-pw" hidden><input type="password" maxlength="64" placeholder="new password (min 6)"><button class="btn" type="submit">Set</button><div class="form-msg troster-msg"></div></form>';
      var pwForm = row.querySelector('.troster-pw'), pwInput = pwForm.querySelector('input'), pwMsg = pwForm.querySelector('.troster-msg');
      row.querySelector('.troster-reset').addEventListener('click', function () { pwForm.hidden = !pwForm.hidden; if (!pwForm.hidden) pwInput.focus(); });
      pwForm.addEventListener('submit', function (e) {
        e.preventDefault();
        var pw = pwInput.value;
        function show(kind, text) { pwMsg.className = 'form-msg show ' + kind; pwMsg.textContent = text; }
        if (pw.length < 6) { show('err', 'At least 6 characters.'); return; }
        var b = pwForm.querySelector('button[type="submit"]'); b.disabled = true;
        BV.resetStudentPassword(s.student_id, pw).then(function (r) {
          b.disabled = false;
          if (r.ok) { show('ok', 'Password updated.'); pwInput.value = ''; }
          else { show('err', r.error); }
        });
      });
      return row;
    }
    function openRoster(c) {
      $('classes-view').hidden = true; $('roster-view').hidden = false;
      $('roster-title').textContent = c.name;
      $('roster-sub').textContent = 'Code ' + c.code;
      var host = $('roster-list'); host.innerHTML = '<div class="lb-empty">Loading…</div>';
      BV.getClassRoster(c.code).then(function (list) {
        host.innerHTML = '';
        if (!list.length) { host.innerHTML = '<div class="lb-empty">No students have joined with code ' + BV.escape(c.code) + ' yet.</div>'; return; }
        list.forEach(function (s) { host.appendChild(rosterRow(s)); });
      });
    }
    $('roster-back').addEventListener('click', function (e) { e.preventDefault(); $('roster-view').hidden = true; $('classes-view').hidden = false; });

    loadClasses();
  })();
  </script>
</body>
</html>
