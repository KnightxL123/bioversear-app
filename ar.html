<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#185FA5">
  <title>BioVerseAR — AR view</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">

  <!-- Vendored model-viewer (no CDN). Point its decoders at local copies so
       Draco-compressed / KTX2 models render with NO network (offline AR). -->
  <script type="module" src="assets/vendor/model-viewer.min.js"></script>
  <script>
    customElements.whenDefined('model-viewer').then(function () {
      var MV = customElements.get('model-viewer');
      MV.dracoDecoderLocation   = new URL('assets/vendor/draco/',  document.baseURI).href;
      MV.ktx2TranscoderLocation = new URL('assets/vendor/basis/',  document.baseURI).href;
    });
  </script>
</head>
<body>
  <div class="app">
    <div class="ar-head">
      <a class="iconbtn" href="dashboard.html" aria-label="Back to topics" title="Back to topics">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="title" id="topic-name">Topic</div>
    </div>

    <model-viewer
      id="mv"
      ar
      ar-modes="scene-viewer"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      alt="3D model">
      <button slot="ar-button" class="ar-btn">View in AR</button>
    </model-viewer>

    <div class="ar-status" id="status" role="status" aria-live="polite">Loading model…</div>
    <p class="ar-note">
      Tap <strong>View in AR</strong> to place the model in your room (opens Android’s Scene Viewer).
      Works offline once this topic has been opened while online at least once.
    </p>

    <div class="spacer-grow"></div>
  </div>

  <script src="topics.js"></script>
  <script src="app.js"></script>
  <script>
  (function () {
    'use strict';
    var profile = BV.requireAuth();
    if (!profile) return;

    var id = new URLSearchParams(location.search).get('topic');
    var t = BV.topic(id);

    // Guard: unknown or not-yet-ready topic → back to the dashboard.
    if (!t || !t.ready || !t.model) { location.replace('dashboard.html'); return; }

    document.title = 'BioVerseAR — ' + t.name;
    document.getElementById('topic-name').textContent = t.name;

    var mv = document.getElementById('mv');
    var status = document.getElementById('status');
    mv.setAttribute('alt', t.name + ' 3D model');
    mv.src = t.model;

    mv.addEventListener('load', function () {
      status.textContent = 'Model ready. Rotate/zoom it here, or tap “View in AR”.';
    });
    mv.addEventListener('error', function () {
      status.textContent = 'Couldn’t load this model. Check that the .glb exists and try again online once.';
    });
    // Reflect AR availability/failures where the browser reports them.
    mv.addEventListener('ar-status', function (e) {
      if (e.detail.status === 'failed') {
        status.textContent = 'AR couldn’t start on this device. It may not support ARCore.';
      }
    });
  })();
  </script>
</body>
</html>
