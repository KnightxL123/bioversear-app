<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#185FA5">
  <title>BioVerseAR — Leaderboard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BioVerseAR">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <div class="ar-head">
      <a class="iconbtn" href="dashboard.html" aria-label="Back to topics">
        <svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="title">Leaderboard</div>
    </div>
    <div class="lb-tabs" id="lb-tabs" role="tablist">
      <button class="lb-tab on" data-scope="class" type="button" role="tab">My Class</button>
      <button class="lb-tab" data-scope="all" type="button" role="tab">Everyone</button>
    </div>
    <p class="lb-scope" id="lb-scope">Loading…</p>

    <div class="lb-me" id="lb-me" hidden>
      <div class="lb-me-rank" id="lb-me-rank">#1</div>
      <div class="lb-me-body">
        <div class="lb-me-name" id="lb-me-name">You</div>
        <div class="lb-me-sub" id="lb-me-sub">0 pts · 0/7 badges</div>
      </div>
      <div class="lb-me-medal">
        <svg viewBox="0 0 24 24" fill="none"><path d="M8 4h8v4a4 4 0 01-8 0V4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 5H5v2a3 3 0 003 3M16 5h3v2a3 3 0 01-3 3M9 20h6M12 12v4M9.5 20v-1a2.5 2.5 0 015 0v1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div class="lb-list" id="lb-list" role="list"><div class="lb-empty" id="lb-loading">Loading leaderboard…</div></div>

    <div class="spacer-grow"></div>
  </div>

  <script src="assets/vendor/supabase.min.js"></script>
  <script src="topics.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
  (function () {
    'use strict';
    var profile = BV.requireAuth(); if (!profile) return;

    var me = profile.alias, myCode = profile.classCode;
    var totalBadges = (window.TOPICS || []).length; // 7

    // Medal icon used in each row's badge count.
    var MEDAL = '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4.6" stroke="currentColor" stroke-width="1.6"/><path d="M9.2 13L8 20l4-2.3L16 20l-1.2-7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';

    // Class codes are matched case/space-insensitively so "7-Rizal" and "7 rizal"
    // still group together (display keeps whatever the student typed).
    function norm(s) { return String(s == null ? '' : s).trim().replace(/\s+/g, ' ').toUpperCase(); }
    // Match "me" by alias + class code (aliases can repeat across classes).
    function isMe(r) { return r.alias === me && (!r.classCode || !myCode || norm(r.classCode) === norm(myCode)); }

    var allRows = [], current = 'class';

    // Rows for the active tab: "class" = only my section; "all" = everyone.
    function scopeRows(scope) {
      if (scope !== 'class' || !myCode) return allRows;
      var anyHaveCode = allRows.some(function (r) { return !!r.classCode; });
      if (!anyHaveCode) return allRows; // offline/local fallback carries no class codes
      return allRows.filter(function (r) { return norm(r.classCode) === norm(myCode); });
    }

    function render(scope) {
      var rows = scopeRows(scope);
      document.getElementById('lb-scope').textContent = (scope === 'class')
        ? ('Class ' + (myCode || '—') + ' · ranked by points')
        : 'All students · ranked by points';

      var myRank = -1;
      for (var i = 0; i < rows.length; i++) { if (isMe(rows[i])) { myRank = i + 1; break; } }
      var mine = myRank > 0 ? rows[myRank - 1] : { score: 0, badges: 0 };
      var meCard = document.getElementById('lb-me');
      meCard.hidden = false;
      document.getElementById('lb-me-rank').textContent = myRank > 0 ? '#' + myRank : '—';
      document.getElementById('lb-me-name').textContent = me;
      document.getElementById('lb-me-sub').textContent =
        mine.score + (mine.score === 1 ? ' pt' : ' pts') + ' · ' + mine.badges + '/' + totalBadges + ' badges'
        + (rows.length > 1 ? ' · rank ' + (myRank > 0 ? myRank : '—') + ' of ' + rows.length : '');

      var host = document.getElementById('lb-list');
      host.innerHTML = '';
      if (!rows.length) {
        host.innerHTML = '<div class="lb-empty">' +
          (scope === 'class'
            ? 'No one from your class is on the board yet — take a quiz to be the first!'
            : 'No scores yet. Take a topic quiz to get on the board!') + '</div>';
        return;
      }
      var meSeen = false;
      rows.forEach(function (r, idx) {
        var rank = idx + 1, mineRow = isMe(r) && !meSeen; if (mineRow) meSeen = true;
        var row = document.createElement('div');
        row.className = 'lb-row' + (mineRow ? ' me' : '');
        row.setAttribute('role', 'listitem');
        var rankCls = 'lb-rank' + (rank <= 3 ? ' rank-' + rank : '');
        var youTag = mineRow ? '<span class="lb-you">You</span>' : '';
        // In the "Everyone" view, tag each row with its class so classes are visible.
        var codeTag = (scope === 'all' && r.classCode) ? '<span class="lb-code">' + BV.escape(r.classCode) + '</span>' : '';
        row.innerHTML =
          '<div class="' + rankCls + '">' + rank + '</div>' +
          '<div class="lb-name">' + BV.escape(r.alias) + youTag + codeTag + '</div>' +
          '<div class="lb-stats">' +
            '<span class="lb-badges" title="Badges earned">' + MEDAL + r.badges + '</span>' +
            '<span class="lb-pts">' + r.score + ' <small>pts</small></span>' +
          '</div>';
        host.appendChild(row);
      });
    }

    document.getElementById('lb-tabs').addEventListener('click', function (e) {
      var b = e.target.closest('.lb-tab'); if (!b) return;
      current = b.getAttribute('data-scope');
      [].forEach.call(this.children, function (c) { c.classList.toggle('on', c === b); });
      render(current);
    });

    // Global board from Supabase; fall back to the on-device list if offline.
    BV.fetchLeaderboard().then(function (rows) { allRows = rows; render(current); },
                             function () { allRows = BV.leaderboard(); render(current); });
  })();
  </script>
</body>
</html>
