<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#185FA5">
  <title>BioVerseAR — Profile</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BioVerseAR">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app has-nav">
    <h1 class="page-h">Profile</h1>

    <div class="profile-head">
      <div class="avatar" id="avatar" aria-hidden="true">?</div>
      <div>
        <div class="p-alias" id="p-alias">student</div>
        <div class="p-class">Class <span id="p-class">—</span></div>
      </div>
    </div>

    <div class="stat-row" style="margin-bottom:22px">
      <div class="stat amber"><div class="num" id="s-badges">0</div><div class="lbl">Badges</div></div>
      <div class="stat"><div class="num" id="s-points">0</div><div class="lbl">Points</div></div>
      <div class="stat"><div class="num" id="s-done">0</div><div class="lbl">Completed</div></div>
    </div>

    <h2 class="section-title">Account</h2>
    <div class="acct-card">
      <div class="acct-row"><span class="acct-k">Name</span><span class="acct-v" id="a-name">—</span></div>
      <div class="acct-row"><span class="acct-k">Username</span><span class="acct-v" id="a-user">—</span></div>
      <div class="acct-row"><span class="acct-k">Class</span><span class="acct-v" id="a-class">—</span></div>
    </div>
    <p class="acct-note">Your name is private — only your teacher can see it. Classmates see only your username.</p>

    <h2 class="section-title">Your explorer</h2>
    <div class="acct-card">
      <div class="av-strip" id="p-avatars"></div>
      <div class="av-tag" id="p-avtag"></div>
      <div class="form-msg" id="av-msg"></div>
      <button class="btn" type="button" id="av-save">Save explorer</button>
    </div>

    <h2 class="section-title">Change password</h2>
    <form id="pw-form" class="acct-card" novalidate>
      <div class="field"><label for="pw-new">New password</label><input id="pw-new" type="password" autocomplete="new-password" maxlength="64" placeholder="at least 6 characters"></div>
      <div class="field"><label for="pw-confirm">Confirm new password</label><input id="pw-confirm" type="password" autocomplete="new-password" maxlength="64" placeholder="type it again"></div>
      <div class="form-msg" id="pw-msg"></div>
      <button class="btn" type="submit">Update password</button>
    </form>

    <button class="btn secondary" id="signout" type="button" style="margin-top:16px">Log out</button>
    <div class="spacer-grow"></div>
  </div>

  <nav id="bottomnav"></nav>

  <script src="assets/vendor/supabase.min.js"></script>
  <script src="topics.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
  (function () {
    'use strict';
    var profile = BV.requireAuth(); if (!profile) return;
    var $ = function (id) { return document.getElementById(id); };

    $('p-alias').textContent = profile.alias;
    $('p-class').textContent = profile.classCode || '—';
    var pav0 = profile.avatar && BV.avatarSvg(profile.avatar);
    if (pav0) $('avatar').innerHTML = pav0;
    else $('avatar').textContent = (profile.alias.trim()[0] || '?').toUpperCase();

    // Account card — the real name is shown to the student themselves only.
    $('a-name').textContent = profile.fullName || '—';
    $('a-user').textContent = profile.alias;
    $('a-class').textContent = profile.classCode || '—';

    var stats = BV.overallStats();
    $('s-badges').textContent = stats.badges;
    $('s-points').textContent = stats.points;
    $('s-done').textContent = stats.done;

    // ---- Change explorer (avatar) ----
    var pAvatar = profile.avatar || '';
    (function buildProfileAvatars() {
      var host = $('p-avatars'), tagEl = $('p-avtag');
      BV.avatars().forEach(function (a) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'av-opt' + (a.id === pAvatar ? ' on' : '');
        b.setAttribute('data-id', a.id);
        b.setAttribute('aria-label', 'Choose ' + a.name);
        b.innerHTML = '<span class="av-face">' + a.svg + '</span><span class="av-nm">' + a.name + '</span>';
        host.appendChild(b);
      });
      function paintTag() { tagEl.innerHTML = pAvatar ? ('<b>' + BV.avatarName(pAvatar) + '</b>' + BV.avatarTag(pAvatar)) : 'Pick a character to represent you.'; }
      host.addEventListener('click', function (e) {
        var b = e.target.closest('.av-opt'); if (!b) return;
        pAvatar = b.getAttribute('data-id');
        [].forEach.call(host.children, function (c) { c.classList.toggle('on', c === b); });
        paintTag();
      });
      paintTag();
    })();
    var avMsg = $('av-msg');
    $('av-save').addEventListener('click', function () {
      if (!pAvatar) { avMsg.className = 'form-msg show err'; avMsg.textContent = 'Pick an explorer first.'; return; }
      var btn = this; btn.disabled = true; var t = btn.textContent; btn.textContent = 'Saving…';
      BV.setAvatar(pAvatar).then(function () {
        btn.disabled = false; btn.textContent = t;
        $('avatar').innerHTML = BV.avatarSvg(pAvatar);
        avMsg.className = 'form-msg show ok'; avMsg.textContent = 'Explorer saved.';
      });
    });

    // Change password (while logged in).
    var msg = $('pw-msg');
    function showMsg(kind, text) { msg.className = 'form-msg show ' + kind; msg.textContent = text; }
    $('pw-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var np = $('pw-new').value, cf = $('pw-confirm').value;
      if (np.length < 6) { showMsg('err', 'Password must be at least 6 characters.'); return; }
      if (np !== cf) { showMsg('err', 'The two passwords do not match.'); return; }
      var btn = this.querySelector('button[type="submit"]'); btn.disabled = true; var t = btn.textContent; btn.textContent = 'Updating…';
      BV.changePassword(np).then(function (r) {
        btn.disabled = false; btn.textContent = t;
        if (r.ok) { showMsg('ok', 'Password updated.'); $('pw-new').value = ''; $('pw-confirm').value = ''; }
        else { showMsg('err', r.error); }
      });
    });
    ['pw-new', 'pw-confirm'].forEach(function (id) { $(id).addEventListener('input', function () { msg.className = 'form-msg'; }); });

    $('signout').addEventListener('click', function () {
      if (confirm('Log out on this device?')) BV.signOut();
    });

    BV.renderNav('profile');
  })();
  </script>
</body>
</html>
