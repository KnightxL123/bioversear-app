<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#185FA5">
  <title>BioVerseAR — Home</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app has-nav">
    <header class="home-head">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><g stroke="#fff" stroke-width="1.4" fill="none"><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/></g><circle cx="12" cy="12" r="2" fill="#fff"/></svg>
      </div>
      <div class="who">
        <div class="hi">Hi, <span id="hi-alias">student</span></div>
        <div class="tagline">Keep learning, keep exploring!</div>
      </div>
      <div class="home-chips">
        <span class="chip-stat" id="badge-chip" title="Badges earned"></span>
        <a class="iconbtn" href="leaderboard.html" aria-label="Leaderboard" title="Leaderboard">
          <svg viewBox="0 0 24 24" fill="none"><path d="M8 4h8v4a4 4 0 01-8 0V4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 5H5v2a3 3 0 003 3M16 5h3v2a3 3 0 01-3 3M9 20h6M12 12v4M9.5 20v-1a2.5 2.5 0 015 0v1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </header>

    <a class="continue" id="continue-card" hidden></a>

    <h2 class="section-title">Explore topics</h2>
    <div class="topics" id="topics" role="list"></div>

    <div class="spacer-grow"></div>
  </div>

  <nav id="bottomnav"></nav>

  <script src="topics.js"></script>
  <script src="app.js"></script>
  <script>
  (function () {
    'use strict';
    var profile = BV.requireAuth(); if (!profile) return;
    var $ = function (id) { return document.getElementById(id); };

    var ICON = {
      cube: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2.8l7.5 4.3v9.8L12 21.2 4.5 16.9V7.1L12 2.8z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 2.8v18.4M4.5 7.1L12 11.4l7.5-4.3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
      lock: '<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 10.5V8a4 4 0 018 0v2.5" stroke="currentColor" stroke-width="1.6"/></svg>',
      medal: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="5.2" stroke="currentColor" stroke-width="1.5"/><path d="M9 13.5L7.5 21l4.5-2.6L16.5 21 15 13.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
      chevron: '<svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };

    $('hi-alias').textContent = profile.alias;
    var stats = BV.overallStats();
    $('badge-chip').innerHTML = ICON.medal + '<span>' + stats.badges + '/' + stats.total + '</span>';

    var topics = window.TOPICS || [], byId = {};
    topics.forEach(function (t) { byId[t.id] = t; });
    var ready = topics.filter(function (t) { return t.ready; });

    // ---- Continue-learning card: last-visited (or first unfinished) topic ----
    var lastId = BV.getLastTopic(), cont = null;
    if (lastId && byId[lastId] && byId[lastId].ready) cont = byId[lastId];
    if (!cont) cont = ready.filter(function (t) { return !BV.hasBadge(t.id); })[0] || ready[0];
    if (cont) {
      var p = BV.topicProgress(cont.id);
      var card = $('continue-card'); card.hidden = false;
      card.href = 'topic.html?topic=' + encodeURIComponent(cont.id);
      card.innerHTML =
        '<div class="ct-label">Continue learning</div>' +
        '<div class="ct-row"><div class="ct-thumb">' + ICON.cube + '</div>' +
          '<div class="ct-name">' + BV.escape(cont.name) + '</div>' +
          '<span class="ct-go">' + (p.attempted ? 'Continue' : 'Start') + '</span></div>' +
        '<div class="ct-bar"><i style="width:' + p.pct + '%"></i></div>' +
        '<div class="ct-sub">' + (p.attempted ? (p.pct + '% · best ' + p.best + '/' + p.max + ' pts') : 'Not started yet — tap to begin') + '</div>';
    }

    // ---- Topic list ----
    var host = $('topics');
    topics.forEach(function (t) {
      var badgeRow = '<div class="badge">' + ICON.medal + '<span>' + BV.escape(t.badge) + '</span></div>';
      var el;
      if (t.ready) {
        var pr = BV.topicProgress(t.id);
        var arNote = t.model ? '' : '<div class="topic-note">Quiz ready · 3D model coming soon</div>';
        var progBar = pr.attempted ? '<div class="topic-prog"><i style="width:' + pr.pct + '%"></i></div>' : '';
        var go = pr.attempted
          ? '<div class="go" style="font-size:13px;font-weight:800;color:var(--primary)">' + pr.pct + '%</div>'
          : '<div class="go">' + ICON.chevron + '</div>';
        el = document.createElement('a');
        el.className = 'topic'; el.setAttribute('role', 'listitem');
        el.href = 'topic.html?topic=' + encodeURIComponent(t.id);
        el.innerHTML = '<div class="thumb">' + ICON.cube + '</div>' +
          '<div class="body"><div class="name">' + BV.escape(t.name) + '</div>' + badgeRow + arNote + progBar + '</div>' + go;
      } else {
        el = document.createElement('div');
        el.className = 'topic locked'; el.setAttribute('role', 'listitem'); el.setAttribute('aria-disabled', 'true');
        el.innerHTML = '<div class="thumb">' + ICON.lock + '</div>' +
          '<div class="body"><div class="name">' + BV.escape(t.name) + '</div>' + badgeRow + '</div>' +
          '<div class="go"><span class="pill">' + ICON.lock + 'Coming soon</span></div>';
      }
      host.appendChild(el);
    });

    BV.renderNav('home');
  })();
  </script>
</body>
</html>
